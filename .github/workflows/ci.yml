name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Vet
        run: go vet ./cmd/... ./internal/... ./migrations/...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/... ./migrations/...
      - name: Build
        run: go build -trimpath ./cmd/neurun

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: neurun:test
