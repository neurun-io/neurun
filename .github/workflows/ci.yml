name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l cmd internal migrations)"
        # The package set is explicit rather than ./..., because
        # frontend/node_modules contains vendored Go files (npm's `flatted`
        # ships one) that ./... would pick up and try to vet, test and cover.
      - name: Vet
        run: go vet ./cmd/... ./internal/... ./migrations/...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/... ./migrations/...
      - name: Build
        run: go build -trimpath ./cmd/neurun

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: neurun:test

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Parse JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' contract; do
            jq -e . "$contract" >/dev/null
          done < <(find contracts -name '*.json' -print0)
      - name: Validate user application contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-user-app.py \
            --application templates/user-app/neurun/application.json \
            --workflow templates/user-app/neurun/workflow.json \
            --expected-workflow neurun/workflow.json \
            --expected-container-context . \
            --expected-container-file Dockerfile \
            --expected-artifact-directory dist
          python3 -m unittest scripts/test_validate_user_app.py
