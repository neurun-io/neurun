syntax = "proto3";

package dagflows.builder.v1;

option go_package = "github.com/dagflows/builder/proto/builder/v1;builderv1";

service BuilderService {
  rpc Build(BuildRequest) returns (BuildResponse);
}

enum Runtime {
  RUNTIME_UNSPECIFIED = 0;
  RUNTIME_PYTHON = 1;
  RUNTIME_NODE = 2;
  RUNTIME_GO = 3;
}

message BuildRequest {
  string app_id = 1;
  string source_path = 2;
  Runtime runtime = 3;
  string entrypoint = 4;
}

message Artifact {
  string name = 1;
  string bucket = 2;
  string key = 3;
  string sha256 = 4;
  int64 size_bytes = 5;
  string media_type = 6;
}

message BuildResponse {
  string build_id = 1;
  repeated Artifact install_layers = 2;
  repeated Artifact code_layers = 3;
  repeated Artifact deployables = 4;
}
