openapi: 3.1.0
info:
  title: Neurun API
  version: 0.1.0
  description: Build Python deployments and execute immutable builds.
servers:
  - url: http://localhost:1267
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Process is healthy.
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        "200":
          description: Storage is ready.
        "503":
          $ref: "#/components/responses/Problem"
  /version:
    get:
      security: []
      operationId: version
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, built_at, api_version, schema_version]
                properties:
                  version: {type: string}
                  commit: {type: string}
                  built_at: {type: string}
                  api_version: {type: string}
                  schema_version: {type: string}
  /v1/auth/register:
    post:
      security: []
      operationId: register
      description: >-
        Create an account and sign it in. The organization is optional: supply
        organization_name to start one you own, or invite_token to join one you
        were invited to, or neither and create or join later. An account may own
        one organization and join any number. Per-IP limiting belongs at the
        edge, not in the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                organization_name: {type: string}
                invite_token: {type: string}
      responses:
        "201":
          description: >-
            Account created. The session cookie is set unless sign-in failed, in
            which case session is absent and the caller signs in normally.
            member and organization are absent when no organization was named,
            or when the organization step failed — the account still stands, and
            the caller starts or joins one afterwards.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  organization: {$ref: "#/components/schemas/Organization"}
                  member: {$ref: "#/components/schemas/Member"}
                  session: {$ref: "#/components/schemas/Session"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/invites/lookup:
    get:
      security: []
      operationId: lookupInvite
      description: >-
        Name the organization a token would join, without spending it, so a
        sign-up page can show it before the account exists.
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The invitation is live.
          content:
            application/json:
              schema:
                type: object
                required: [organization, email, role]
                properties:
                  organization: {$ref: "#/components/schemas/Organization"}
                  email: {type: string, format: email}
                  role: {$ref: "#/components/schemas/Role"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
  /v1/auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionEnvelope"}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/auth/logout:
    post:
      security: []
      operationId: logout
      responses:
        "204": {description: Session cleared.}
  /v1/auth/session:
    get:
      security: []
      operationId: getSession
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionEnvelope"}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/organizations:
    post:
      operationId: createOrganization
      description: >-
        Start an organization. Refused with 409 if the account already owns one.
        The session cookie is re-issued so the new membership is live at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201":
          description: Organization created and the session moved into it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Organization"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listOrganizations
      description: Every organization the signed-in account belongs to.
      responses:
        "200":
          description: Organizations.
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items: {$ref: "#/components/schemas/Organization"}
  /v1/organization:
    get:
      operationId: getOrganization
      description: The organization this credential acts in.
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Organization"}
    patch:
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200":
          description: Organization renamed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Organization"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/members:
    get:
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Members of this organization.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: {$ref: "#/components/schemas/Member"}
  /v1/members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string}
    patch:
      operationId: updateMember
      description: >-
        Change a member role. The owner cannot be demoted, so an organization
        always has somebody who can administer it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "409": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: removeMember
      description: Remove a member. The owner cannot be removed.
      responses:
        "204": {description: Member removed.}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/invites:
    get:
      operationId: listInvites
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Invitations issued by this organization.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: {$ref: "#/components/schemas/Invite"}
    post:
      operationId: createInvite
      description: >-
        Offer membership to an address. The token is returned exactly once;
        only its digest is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedInvite"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/invites/accept:
    post:
      operationId: acceptInvite
      description: Join an organization with an invitation, as an existing account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string}
      responses:
        "200":
          description: Membership granted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
  /v1/invites/{invite_id}:
    parameters:
      - name: invite_id
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: revokeInvite
      responses:
        "204": {description: Invitation revoked.}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Projects visible to the principal.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: {$ref: "#/components/schemas/Project"}
  /v1/projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getProject
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
  /v1/apps:
    get:
      operationId: listApps
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: name
          in: query
          description: Return the app with this exact project-scoped name.
          schema: {type: string, minLength: 1, maxLength: 120}
      responses:
        "200":
          description: Apps in the authenticated project.
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items: {$ref: "#/components/schemas/App"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, repository]
              properties:
                name: {type: string}
                repository:
                  type: string
                  description: >-
                    owner/name on GitHub. Required: an app has no other source
                    of code, and the installation must already be able to read
                    it.
                production_ref:
                  type: string
                  description: >-
                    The ref whose pushes deploy. Empty follows the repository's
                    default branch.
      responses:
        "201":
          description: App created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/apps/{app_id}:
    parameters:
      - name: app_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getApp
      responses:
        "200":
          description: App.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200":
          description: App updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/apps/{app_id}/repository:
    parameters:
      - name: app_id
        in: path
        required: true
        schema: {type: string}
    put:
      operationId: connectRepository
      description: >-
        Point the app at a GitHub repository, or disconnect it by sending an
        empty repository. The installation must already be able to read it: the
        ref is resolved before anything is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repository]
              properties:
                repository:
                  type: string
                  description: owner/name, or empty to disconnect.
                production_ref:
                  type: string
                  description: >-
                    The ref a push must touch to deploy. Empty follows the
                    repository's default branch.
      responses:
        "200":
          description: App connected.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/github/installation:
    get:
      operationId: getInstallation
      responses:
        "200":
          description: The organization's GitHub App installation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Installation"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      operationId: recordInstallation
      description: >-
        Record the installation GitHub redirects back with after somebody
        installs the app. The account it is installed on is read from GitHub,
        since the redirect carries only the installation id. Re-installing
        replaces the previous record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id]
              properties:
                installation_id: {type: string}
      responses:
        "201":
          description: Installation recorded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Installation"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteInstallation
      responses:
        "204": {description: Installation forgotten.}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/github/repositories:
    get:
      operationId: listRepositories
      description: The repositories this organization's installation can read.
      responses:
        "200":
          description: Repositories the installation grants.
          content:
            application/json:
              schema:
                type: object
                required: [repositories]
                properties:
                  repositories:
                    type: array
                    items: {$ref: "#/components/schemas/Repository"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/github/branches:
    get:
      operationId: listBranches
      parameters:
        - name: repository
          in: query
          required: true
          description: owner/name.
          schema: {type: string}
      responses:
        "200":
          description: Branch names.
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items: {type: string}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/github/deployments:
    post:
      operationId: deployRef
      description: >-
        Queue a ref of the app's connected repository. An absent ref uses the
        app's production ref. A push to that ref does the same thing without
        this call. The deployment comes back queued — follow it for its status
        and its logs; the build runs on its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app_id]
              properties:
                app_id: {type: string}
                ref: {type: string}
      responses:
        "202":
          description: Deployment queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Deployment"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/users:
    get:
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/User"}
  /v1/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getUser
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: {type: string}
                role: {type: string, enum: [admin, operator, viewer]}
                disabled: {type: boolean}
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /v1/identity-catalog:
    get:
      operationId: getIdentityCatalog
      description: >-
        The values a browser identity is assembled from. Static reference data,
        not organization state. Most of these fields are only coherent in
        combination, so entries carry the platform they belong to: a Direct3D
        renderer on a Mac, or a Windows release nobody shipped, is the
        contradiction a detector looks for.
      responses:
        "200":
          description: Identity catalogue.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IdentityCatalog"}
  /v1/browser-profiles:
    get:
      operationId: listBrowserProfiles
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Browser profiles in the organization.
          content:
            application/json:
              schema:
                type: object
                required: [browser_profiles]
                properties:
                  browser_profiles:
                    type: array
                    items: {$ref: "#/components/schemas/BrowserProfile"}
        "503": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createBrowserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
                identity:
                  allOf: [{$ref: "#/components/schemas/BrowserIdentity"}]
                  description: >-
                    Absent means no opinion, not a bare browser: one is drawn
                    from the catalogue, seeded so it holds still for this profile
                    and differs from the next. It names the browser, which is why
                    there is no separate field for that.
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserProfile"}
  /v1/browser-profiles/{browser_profile_id}:
    parameters:
      - name: browser_profile_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getBrowserProfile
      responses:
        "200":
          description: Browser profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserProfile"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateBrowserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string}
                identity:
                  allOf: [{$ref: "#/components/schemas/BrowserIdentity"}]
                  description: >-
                    Replaces the presentation; omitted leaves it alone. There is
                    no way to remove it — every profile wears one.
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserProfile"}
    delete:
      operationId: deleteBrowserProfile
      responses:
        "204": {description: Profile deleted.}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/browser-profiles/{browser_profile_id}/state:
    parameters:
      - name: browser_profile_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getBrowserProfileState
      description: >-
        Cookie values and storage contents in the clear — what the SDK reads
        before it opens a browser on loopback. This is exporting live
        credentials, so it takes browser_profiles:write rather than :read.
      responses:
        "200":
          description: Profile state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserProfileState"}
        "404": {$ref: "#/components/responses/Problem"}
    put:
      operationId: saveBrowserProfileState
      description: >-
        Stores what a closed session captured. A whole-state replace, not a
        merge: the browser returns its entire cookie jar, so a cookie missing
        from the body was deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrowserProfileState"}
      responses:
        "200":
          description: State stored; the profile is returned as it now stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowserProfile"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/api-keys:
    get:
      operationId: listAPIKeys
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project API keys.
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items: {$ref: "#/components/schemas/APIKey"}
    post:
      operationId: createAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name: {type: string}
                user_id: {type: string}
                scopes:
                  type: array
                  items: {type: string}
      responses:
        "201":
          description: Key created; secret is returned only here.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedAPIKey"}
  /v1/api-keys/{api_key_id}:
    parameters:
      - name: api_key_id
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: revokeAPIKey
      responses:
        "200":
          description: Key revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/APIKey"}
  /v1/builds:
    get:
      operationId: listBuilds
      description: >-
        Every build the organization's deployments produced, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: deployment_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Builds.
          content:
            application/json:
              schema:
                type: object
                required: [builds]
                properties:
                  builds:
                    type: array
                    items: {$ref: "#/components/schemas/Build"}
  /v1/builds/{build_id}:
    parameters:
      - name: build_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getBuild
      responses:
        "200":
          description: Build.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Build"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/deployments:
    get:
      operationId: listDeployments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: app_id
          in: query
          description: Return only deployments owned by this project-scoped App.
          schema: {type: string}
      responses:
        "200":
          description: Project deployments.
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items: {$ref: "#/components/schemas/Deployment"}
        "401":
          $ref: "#/components/responses/Problem"
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/deployments/{deployment_id}:
    parameters:
      - $ref: "#/components/parameters/DeploymentID"
    get:
      operationId: getDeployment
      responses:
        "200":
          description: Deployment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Deployment"}
        "404":
          $ref: "#/components/responses/Problem"
  /v1/deployments/{deployment_id}/retry:
    parameters:
      - $ref: "#/components/parameters/DeploymentID"
    post:
      operationId: retryDeployment
      description: >-
        Build the same commit again as a new deployment. The ref is not
        resolved again — a retry builds what this deployment built.
      responses:
        "202":
          description: Deployment queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Deployment"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /v1/executions:
    get:
      operationId: listExecutions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: deployment_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Project executions.
          content:
            application/json:
              schema:
                type: object
                required: [executions]
                properties:
                  executions:
                    type: array
                    items: {$ref: "#/components/schemas/Execution"}
    post:
      operationId: createExecution
      description: >-
        Run an app. build_id picks one of its builds; absent takes the latest
        the app has ready. The execution is pinned to that build and stays
        there, whatever is deployed afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app_id, input]
              properties:
                app_id: {type: string}
                build_id: {type: string}
                input: {}
      responses:
        "202":
          description: Execution durably queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/executions/{execution_id}:
    parameters:
      - $ref: "#/components/parameters/ExecutionID"
    get:
      operationId: getExecution
      responses:
        "200":
          description: Execution.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "404":
          $ref: "#/components/responses/Problem"
  /v1/executions/{execution_id}/rerun:
    parameters:
      - $ref: "#/components/parameters/ExecutionID"
    post:
      operationId: rerunExecution
      responses:
        "202":
          description: New execution queued with the exact original build and input.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    DeploymentID:
      name: deployment_id
      in: path
      required: true
      schema: {type: string}
    ExecutionID:
      name: execution_id
      in: path
      required: true
      schema: {type: string}
  responses:
    Problem:
      description: Request could not be completed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Session:
      type: object
      required: [user_id, email, organization_id, role, scopes, expires_at]
      properties:
        user_id: {type: string}
        email: {type: string, format: email}
        organization_id: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        scopes:
          type: array
          items: {type: string}
        expires_at: {type: string, format: date-time}
    SessionEnvelope:
      type: object
      required: [session]
      properties:
        session: {$ref: "#/components/schemas/Session"}
    Project:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    App:
      type: object
      required: [id, project_id, name, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        name: {type: string}
        repository:
          type: string
          description: owner/name on GitHub. Absent when the app is not connected.
        production_ref:
          type: string
          description: The ref whose pushes deploy. Absent follows the default branch.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Repository:
      type: object
      required: [full_name, default_branch, private]
      properties:
        full_name: {type: string}
        default_branch: {type: string}
        private: {type: boolean}
    Installation:
      type: object
      required: [id, organization_id, installation_id, account_login, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        installation_id: {type: integer, format: int64}
        account_login: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      required: [id, email, disabled, created_at, updated_at]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        disabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Organization:
      type: object
      required: [id, name, owner_user_id, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        owner_user_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Member:
      type: object
      required: [user_id, email, role, owner, created_at, updated_at]
      properties:
        user_id: {type: string}
        email: {type: string, format: email}
        role: {$ref: "#/components/schemas/Role"}
        owner: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Invite:
      type: object
      required: [id, email, role, status, created_at, expires_at]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {$ref: "#/components/schemas/Role"}
        invited_by: {type: string}
        status: {type: string, enum: [pending, accepted, revoked, expired]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        accepted_at:
          type: [string, "null"]
          format: date-time
    CreatedInvite:
      allOf:
        - $ref: "#/components/schemas/Invite"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Returned exactly once. Only a digest is stored.
    BrowserKind:
      type: string
      description: >-
        Chrome is the only browser that launches; Safari is a Chrome wearing
        Safari, which is what a site reads either way.
      enum: [chrome, safari]
    BrowserProfile:
      type: object
      description: >-
        A browser persona. Cookie values and the identity proxy are secrets and
        are never returned here; GET .../state returns them.
      required: [id, name, browser, identity, cookies, storage_origins, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        browser:
          allOf: [{$ref: "#/components/schemas/BrowserKind"}]
          description: >-
            Repeats identity.browser, so a list view does not have to reach into
            the identity for it.
        identity: {$ref: "#/components/schemas/RedactedBrowserIdentity"}
        cookies:
          type: array
          items: {$ref: "#/components/schemas/RedactedCookie"}
        storage_origins:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    IdentityCatalog:
      type: object
      description: >-
        Selectable values for a BrowserIdentity. Several are binding: an
        operating system fixes navigator.platform, bitness and architecture,
        limits which releases, browsers and cards exist under it, and each release
        carries its own UA-CH platform versions — Windows 11 reports 15.0.0,
        and Windows 7 and 8 both report 0.0.0.
      required:
        [operating_systems, devices, browsers, screens, density_pixel_ratios,
         hardware_concurrency, memory, geos]
      properties:
        operating_systems:
          type: array
          items: {$ref: "#/components/schemas/CatalogOS"}
        devices:
          type: array
          description: Handsets. The binding unit on mobile.
          items: {$ref: "#/components/schemas/CatalogDevice"}
        browsers:
          type: array
          items: {$ref: "#/components/schemas/CatalogBrowser"}
        screens:
          type: array
          items: {$ref: "#/components/schemas/CatalogScreen"}
        density_pixel_ratios:
          type: array
          description: Pairs with a screen to give the physical resolution.
          items: {type: number}
        hardware_concurrency:
          type: array
          items: {type: integer}
        memory:
          type: array
          description: deviceMemory in GiB. The browser caps what it reports at 8.
          items: {type: integer}
        geos:
          type: array
          items: {$ref: "#/components/schemas/CatalogGeo"}
    CatalogOS:
      type: object
      required:
        [os, form_factor, navigator_platform, bitness, architecture, browsers,
         versions, gpus]
      properties:
        os: {type: string, enum: [Windows, Macintosh, Linux, Android, Ios]}
        form_factor:
          type: string
          enum: [desktop, mobile]
          description: >-
            A mobile system carries no platform, releases or cards of its own —
            the handset does, so a device is chosen first and fixes them.
        navigator_platform: {type: string}
        bitness: {type: string}
        architecture: {type: string}
        browsers:
          type: array
          description: What runs on the platform. There is no Safari on Windows.
          items: {$ref: "#/components/schemas/BrowserKind"}
        versions:
          type: array
          items: {$ref: "#/components/schemas/CatalogOSVersion"}
        gpus:
          type: array
          description: The cards this system reports. Empty on a mobile system.
          items: {$ref: "#/components/schemas/CatalogGPU"}
    CatalogOSVersion:
      type: object
      description: >-
        One release and the UA-CH platform versions that belong to it, newest
        first. The release a user names and the value that ships in the record
        are different strings.
      required: [os_version, platform_versions]
      properties:
        os_version: {type: string}
        platform_versions:
          type: array
          items: {type: string}
    CatalogDevice:
      type: object
      description: >-
        A handset, and the binding unit on mobile: one model fixes the screen,
        the ratio, the GPU, the cores and the memory together, because they
        shipped in one box. Only the release and which card answered are choices.
      required:
        [name, os, browsers, models, versions, navigator_platforms, screen,
         hardware_concurrency, memory, gpus]
      properties:
        name: {type: string}
        os: {type: string, enum: [Windows, Macintosh, Linux, Android, Ios]}
        browsers:
          type: array
          items: {$ref: "#/components/schemas/BrowserKind"}
        models:
          type: array
          description: What Sec-CH-UA-Model reports; several codes share one handset.
          items: {type: string}
        versions:
          type: array
          items: {$ref: "#/components/schemas/CatalogOSVersion"}
        navigator_platforms:
          type: array
          items: {type: string}
        screen:
          type: object
          required:
            [logical_width, logical_height, original_width, original_height,
             density_pixel_ratio]
          properties:
            logical_width: {type: integer}
            logical_height: {type: integer}
            original_width: {type: integer}
            original_height: {type: integer}
            density_pixel_ratio: {type: number}
        hardware_concurrency:
          type: array
          items: {type: integer}
        memory:
          type: array
          items: {type: integer}
        gpus:
          type: array
          items: {$ref: "#/components/schemas/CatalogGPU"}
    CatalogBrowser:
      type: object
      required: [browser, versions]
      properties:
        browser: {$ref: "#/components/schemas/BrowserKind"}
        versions:
          type: array
          description: Released versions, newest first.
          items: {type: string}
    CatalogScreen:
      type: object
      description: A logical resolution and the share of desktops reporting it.
      required: [width, height, share]
      properties:
        width: {type: integer}
        height: {type: integer}
        share: {type: number}
    CatalogGPU:
      type: object
      description: >-
        One card's WebGL strings. It says nothing about where it runs because it
        does not have to: it is listed under the system or the handset that
        reports it, and ANGLE over Direct3D on a Mac is not a card in the wrong
        place, it is a card that does not exist.
      required: [vendor, webgl_renderer, webgl_vendor]
      properties:
        vendor: {type: string}
        webgl_renderer: {type: string}
        webgl_vendor: {type: string}
    CatalogGeo:
      type: object
      description: >-
        What a country implies about language and clock. Exit geography that
        disagrees with either is a known tell.
      required: [code, languages, timezone]
      properties:
        code:
          type: string
          enum: [US, UK, JP, DE, FR, CA, AU, IN, BR, KR, IT, ES, NL, PL, SE, MX, SG, ZA]
        languages:
          type: array
          items: {type: string}
        timezone: {type: string}
    BrowserIdentity:
      type: object
      description: Mirrors the rustenium-identity record the browser server applies.
      required:
        [os, os_version, platform, browser, browser_version, screen,
         hardware_concurrency, memory, gpu, geo, language]
      properties:
        device_model: {type: string, description: Empty means desktop or laptop.}
        has_battery: {type: boolean}
        has_mouse: {type: boolean}
        has_touch: {type: boolean}
        os: {type: string, enum: [Windows, Macintosh, Linux, Android, Ios]}
        os_version: {type: string}
        platform:
          type: object
          required: [navigator_platform, version]
          properties:
            bitness: {type: string}
            architecture: {type: string}
            navigator_platform: {type: string}
            version: {type: string}
        browser:
          allOf: [{$ref: "#/components/schemas/BrowserKind"}]
          description: >-
            What it claims to be, not what runs: rustenium-identity drives
            Chrome, so a Safari profile is a Chrome wearing Safari.
        browser_version:
          type: array
          items: {type: integer}
        screen:
          type: object
          required:
            [logical_width, logical_height, original_width, original_height,
             density_pixel_ratio]
          properties:
            logical_width: {type: integer}
            logical_height: {type: integer}
            original_width: {type: integer}
            original_height: {type: integer}
            density_pixel_ratio: {type: number}
        hardware_concurrency: {type: integer}
        memory: {type: integer, description: deviceMemory in GiB.}
        gpu:
          type: object
          required: [vendor, webgl_renderer, webgl_vendor]
          properties:
            vendor: {type: string}
            webgl_renderer: {type: string}
            webgl_vendor: {type: string}
        geo:
          type: string
          enum: [US, UK, JP, DE, FR, CA, AU, IN, BR, KR, IT, ES, NL, PL, SE, MX, SG, ZA]
        language:
          type: array
          items: {type: string}
        history_count: {type: integer}
        proxy:
          type: string
          description: >-
            A full URL with credentials. Write-only: it is never returned.
        timezone: {type: string, description: IANA name; empty resolves via the proxy.}
    RedactedBrowserIdentity:
      allOf:
        - $ref: "#/components/schemas/BrowserIdentity"
        - type: object
          required: [proxy_set]
          properties:
            proxy_set:
              type: boolean
              description: Whether a proxy is configured. The URL itself is not returned.
    RedactedCookie:
      type: object
      description: >-
        Enough to see what a profile is logged into, and to delete it, without
        reading the credential.
      required: [name, domain, path, secure, http_only, value_size]
      properties:
        name: {type: string}
        domain: {type: string}
        path: {type: string}
        expires: {type: number, description: Unix seconds; absent for a session cookie.}
        secure: {type: boolean}
        http_only: {type: boolean}
        same_site: {type: string}
        value_size: {type: integer}
    Cookie:
      type: object
      required: [name, value, domain, path, secure, http_only]
      properties:
        name: {type: string}
        value: {type: string}
        domain: {type: string}
        path: {type: string}
        expires: {type: number}
        secure: {type: boolean}
        http_only: {type: boolean}
        same_site: {type: string}
    BrowserStorage:
      type: object
      description: Origin to key to value.
      additionalProperties:
        type: object
        additionalProperties: {type: string}
    BrowserProfileState:
      type: object
      required: [cookies, local_storage, session_storage]
      properties:
        cookies:
          type: array
          items: {$ref: "#/components/schemas/Cookie"}
        local_storage: {$ref: "#/components/schemas/BrowserStorage"}
        session_storage: {$ref: "#/components/schemas/BrowserStorage"}
    APIKey:
      type: object
      required: [id, organization_id, name, prefix, scopes, created_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        user_id: {type: string}
        name: {type: string}
        prefix: {type: string}
        scopes:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [secret]
          properties:
            secret: {type: string}
    Artifact:
      description: >-
        One stored ZIP. name is what the layer is to the runtime — code and
        install today — and is what a runner unpacks it into.
      type: object
      required: [id, name, size_bytes, sha256, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        size_bytes: {type: integer, format: int64}
        sha256: {type: string}
        created_at: {type: string, format: date-time}
    Failure:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    Build:
      description: >-
        What a deployment produced: the artifacts, and what identifies them. A
        build carries no status and no failure — the deployment that ran it
        does, and a deployment that produced nothing has no build at all.
      type: object
      required: [id, runtime, entrypoint, source_sha256, artifacts, created_at]
      properties:
        id: {type: string}
        runtime: {type: string, enum: [python, rust, go, ruby, node]}
        entrypoint: {type: string}
        source_sha256: {type: string}
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/Artifact"}
        created_at: {type: string, format: date-time}
        deployment_id: {type: string}
        app_id: {type: string}
    Deployment:
      description: >-
        One attempt to turn a source archive into a build. Statuses run
        queued → building → publishing → ready or failed; logs carry what the
        toolchain printed and arrive while it is still running.
      type: object
      required: [id, project_id, app_id, runtime, entrypoint, status, source, logs, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        app_id: {type: string}
        runtime: {type: string, enum: [python, rust, go, ruby, node]}
        entrypoint: {type: string}
        status: {type: string, enum: [queued, building, publishing, ready, failed]}
        source: {$ref: "#/components/schemas/Artifact"}
        commit_sha: {type: string}
        git_ref: {type: string}
        build:
          oneOf:
            - $ref: "#/components/schemas/Build"
            - type: "null"
        failure:
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
        logs: {type: string}
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Execution:
      type: object
      required: [id, project_id, deployment_id, build_id, status, input, logs, created_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        deployment_id: {type: string}
        build_id: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        input: {}
        output: {}
        failure:
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
        logs: {type: string}
        created_at: {type: string, format: date-time}
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        rerun_of_execution_id: {type: string}
    Problem:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: {$ref: "#/components/schemas/Problem"}
