openapi: 3.1.0
info:
  title: Neurun API
  version: 0.1.0
  description: Build Python deployments and execute immutable builds.
servers:
  - url: http://localhost:1267
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Process is healthy.
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        "200":
          description: Storage is ready.
        "503":
          $ref: "#/components/responses/Problem"
  /version:
    get:
      security: []
      operationId: version
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, built_at, api_version, schema_version]
                properties:
                  version: {type: string}
                  commit: {type: string}
                  built_at: {type: string}
                  api_version: {type: string}
                  schema_version: {type: string}
  /v1/auth/register:
    post:
      security: []
      operationId: register
      description: >-
        Create an account and sign it in. The organization is optional: supply
        organization_name to start one you own, or invite_token to join one you
        were invited to, or neither and create or join later. An account may own
        one organization and join any number. Per-IP limiting belongs at the
        edge, not in the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                organization_name: {type: string}
                invite_token: {type: string}
      responses:
        "201":
          description: >-
            Account created. The session cookie is set unless sign-in failed, in
            which case operator is absent and the caller signs in normally.
          content:
            application/json:
              schema:
                type: object
                required: [user, member]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  organization: {$ref: "#/components/schemas/Organization"}
                  member: {$ref: "#/components/schemas/Member"}
                  operator: {$ref: "#/components/schemas/Operator"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/invites/lookup:
    get:
      security: []
      operationId: lookupInvite
      description: >-
        Name the organization a token would join, without spending it, so a
        sign-up page can show it before the account exists.
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The invitation is live.
          content:
            application/json:
              schema:
                type: object
                required: [organization, email, role]
                properties:
                  organization: {$ref: "#/components/schemas/Organization"}
                  email: {type: string, format: email}
                  role: {$ref: "#/components/schemas/Role"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
  /v1/auth/login:
    post:
      security: []
      operationId: operatorLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        "200":
          description: Operator session created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperatorEnvelope"}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/auth/logout:
    post:
      security: []
      operationId: operatorLogout
      responses:
        "204": {description: Session cleared.}
  /v1/auth/session:
    get:
      security: []
      operationId: getOperatorSession
      responses:
        "200":
          description: Current operator.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperatorEnvelope"}
        "401": {$ref: "#/components/responses/Problem"}
  /v1/organizations:
    post:
      operationId: createOrganization
      description: >-
        Start an organization. Refused with 409 if the account already owns one.
        The session cookie is re-issued so the new membership is live at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201":
          description: Organization created and the session moved into it.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Organization"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    get:
      operationId: listOrganizations
      description: Every organization the signed-in account belongs to.
      responses:
        "200":
          description: Organizations.
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items: {$ref: "#/components/schemas/Organization"}
  /v1/organization:
    get:
      operationId: getOrganization
      description: The organization this credential acts in.
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Organization"}
    patch:
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200":
          description: Organization renamed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Organization"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/members:
    get:
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Members of this organization.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: {$ref: "#/components/schemas/Member"}
  /v1/members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string}
    patch:
      operationId: updateMember
      description: >-
        Change a member role. The owner cannot be demoted, so an organization
        always has somebody who can administer it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "409": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: removeMember
      description: Remove a member. The owner cannot be removed.
      responses:
        "204": {description: Member removed.}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/invites:
    get:
      operationId: listInvites
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Invitations issued by this organization.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: {$ref: "#/components/schemas/Invite"}
    post:
      operationId: createInvite
      description: >-
        Offer membership to an address. The token is returned exactly once;
        only its digest is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "201":
          description: Invitation created.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedInvite"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /v1/invites/accept:
    post:
      operationId: acceptInvite
      description: Join an organization with an invitation, as an existing account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string}
      responses:
        "200":
          description: Membership granted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
  /v1/invites/{invite_id}:
    parameters:
      - name: invite_id
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: revokeInvite
      responses:
        "204": {description: Invitation revoked.}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Projects visible to the principal.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: {$ref: "#/components/schemas/Project"}
  /v1/projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getProject
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
  /v1/apps:
    get:
      operationId: listApps
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: name
          in: query
          description: Return the app with this exact project-scoped name.
          schema: {type: string, minLength: 1, maxLength: 120}
      responses:
        "200":
          description: Apps in the authenticated project.
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items: {$ref: "#/components/schemas/App"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201":
          description: App created.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/apps/{app_id}:
    parameters:
      - name: app_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getApp
      responses:
        "200":
          description: App.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200":
          description: App updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /v1/users:
    get:
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/User"}
  /v1/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getUser
      responses:
        "200":
          description: User.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: {type: string}
                role: {type: string, enum: [admin, operator, viewer]}
                disabled: {type: boolean}
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /v1/api-keys:
    get:
      operationId: listAPIKeys
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project API keys.
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items: {$ref: "#/components/schemas/APIKey"}
    post:
      operationId: createAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name: {type: string}
                user_id: {type: string}
                scopes:
                  type: array
                  items: {type: string}
      responses:
        "201":
          description: Key created; secret is returned only here.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedAPIKey"}
  /v1/api-keys/{api_key_id}:
    parameters:
      - name: api_key_id
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: revokeAPIKey
      responses:
        "200":
          description: Key revoked.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/APIKey"}
  /v1/builds:
    get:
      operationId: listBuilds
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: deployment_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Project builds.
          content:
            application/json:
              schema:
                type: object
                required: [builds]
                properties:
                  builds:
                    type: array
                    items: {$ref: "#/components/schemas/Build"}
  /v1/builds/{build_id}:
    parameters:
      - name: build_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getBuild
      responses:
        "200":
          description: Build.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Build"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/deployments:
    get:
      operationId: listDeployments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: app_id
          in: query
          description: Return only deployments owned by this project-scoped App.
          schema: {type: string}
      responses:
        "200":
          description: Project deployments.
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items: {$ref: "#/components/schemas/Deployment"}
        "401":
          $ref: "#/components/responses/Problem"
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    post:
      operationId: createDeployment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [app_id, runtime, source]
              properties:
                app_id:
                  type: string
                runtime:
                  type: string
                  const: python
                entrypoint:
                  type: string
                  default: main.py:handler
                source:
                  type: string
                  format: binary
      responses:
        "201":
          description: Deployment built successfully.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Deployment"}
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/deployments/{deployment_id}:
    parameters:
      - $ref: "#/components/parameters/DeploymentID"
    get:
      operationId: getDeployment
      responses:
        "200":
          description: Deployment.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Deployment"}
        "404":
          $ref: "#/components/responses/Problem"
  /v1/deployments/{deployment_id}/executions:
    parameters:
      - $ref: "#/components/parameters/DeploymentID"
    get:
      operationId: listDeploymentExecutions
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Executions for this deployment.
          content:
            application/json:
              schema:
                type: object
                required: [executions]
                properties:
                  executions:
                    type: array
                    items: {$ref: "#/components/schemas/Execution"}
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createDeploymentExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input]
              properties:
                input: {}
      responses:
        "202":
          description: Execution durably queued and pinned to the latest ready build.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/executions:
    get:
      operationId: listExecutions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: deployment_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Project executions.
          content:
            application/json:
              schema:
                type: object
                required: [executions]
                properties:
                  executions:
                    type: array
                    items: {$ref: "#/components/schemas/Execution"}
  /v1/executions/{execution_id}:
    parameters:
      - $ref: "#/components/parameters/ExecutionID"
    get:
      operationId: getExecution
      responses:
        "200":
          description: Execution.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "404":
          $ref: "#/components/responses/Problem"
  /v1/executions/{execution_id}/rerun:
    parameters:
      - $ref: "#/components/parameters/ExecutionID"
    post:
      operationId: rerunExecution
      responses:
        "202":
          description: New execution queued with the exact original build and input.
          headers:
            Location: {$ref: "#/components/headers/Location"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "404":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    Location:
      schema: {type: string}
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    DeploymentID:
      name: deployment_id
      in: path
      required: true
      schema: {type: string}
    ExecutionID:
      name: execution_id
      in: path
      required: true
      schema: {type: string}
  responses:
    Problem:
      description: Request could not be completed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Operator:
      type: object
      required: [operator_id, email, organization_id, role, scopes, session_id, expires_at]
      properties:
        operator_id: {type: string}
        email: {type: string, format: email}
        organization_id: {type: string}
        role: {$ref: "#/components/schemas/Role"}
        scopes:
          type: array
          items: {type: string}
        session_id: {type: string}
        expires_at: {type: string, format: date-time}
    OperatorEnvelope:
      type: object
      required: [operator]
      properties:
        operator: {$ref: "#/components/schemas/Operator"}
    Project:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    App:
      type: object
      required: [id, project_id, name, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Role:
      type: string
      enum: [admin, operator, viewer]
    User:
      type: object
      required: [id, email, disabled, created_at, updated_at]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        disabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Organization:
      type: object
      required: [id, name, owner_user_id, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        owner_user_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Member:
      type: object
      required: [user_id, email, role, owner, created_at, updated_at]
      properties:
        user_id: {type: string}
        email: {type: string, format: email}
        role: {$ref: "#/components/schemas/Role"}
        owner: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Invite:
      type: object
      required: [id, email, role, status, created_at, expires_at]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {$ref: "#/components/schemas/Role"}
        invited_by: {type: string}
        status: {type: string, enum: [pending, accepted, revoked, expired]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        accepted_at:
          type: [string, "null"]
          format: date-time
    CreatedInvite:
      allOf:
        - $ref: "#/components/schemas/Invite"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Returned exactly once. Only a digest is stored.
    APIKey:
      type: object
      required: [id, organization_id, name, prefix, scopes, created_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        user_id: {type: string}
        name: {type: string}
        prefix: {type: string}
        scopes:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [secret]
          properties:
            secret: {type: string}
    Artifact:
      type: object
      required: [id, kind, name, media_type, size_bytes, sha256, created_at]
      properties:
        id: {type: string}
        kind: {type: string}
        name: {type: string}
        media_type: {type: string}
        size_bytes: {type: integer, format: int64}
        sha256: {type: string}
        created_at: {type: string, format: date-time}
    Failure:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    Build:
      type: object
      required: [id, project_id, deployment_id, number, status, runtime, entrypoint, source_sha256, artifacts, started_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        deployment_id: {type: string}
        number: {type: integer}
        status: {type: string, enum: [building, ready, failed]}
        runtime: {type: string, const: python}
        entrypoint: {type: string}
        source_sha256: {type: string}
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/Artifact"}
        failure:
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
        started_at: {type: string, format: date-time}
        finished_at:
          type: [string, "null"]
          format: date-time
    Deployment:
      type: object
      required: [id, project_id, app_id, runtime, entrypoint, status, source, builds, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        app_id: {type: string}
        runtime: {type: string, const: python}
        entrypoint: {type: string}
        status: {type: string, enum: [uploaded, building, ready, failed]}
        source: {$ref: "#/components/schemas/Artifact"}
        builds:
          type: array
          items: {$ref: "#/components/schemas/Build"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Execution:
      type: object
      required: [id, project_id, deployment_id, build_id, status, input, logs, created_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        deployment_id: {type: string}
        build_id: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        input: {}
        output: {}
        failure:
          oneOf:
            - $ref: "#/components/schemas/Failure"
            - type: "null"
        logs: {type: string}
        created_at: {type: string, format: date-time}
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        rerun_of_execution_id: {type: string}
    Problem:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: {$ref: "#/components/schemas/Problem"}
