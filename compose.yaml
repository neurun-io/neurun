name: neurun

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neurun
      POSTGRES_USER: neurun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurun-local-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurun -d neurun"]
      interval: 5s
      timeout: 3s
      retries: 20

  neurun:
    build:
      context: .
    environment:
      NEURUN_HTTP_ADDR: :1267
      NEURUN_PUBLIC_URL: ${NEURUN_PUBLIC_URL:-http://localhost:1267}
      NEURUN_API_KEY: ${NEURUN_API_KEY:?set NEURUN_API_KEY in .env}
      NEURUN_DEFAULT_PROJECT_ID: ${NEURUN_DEFAULT_PROJECT_ID:-prj_local}
      NEURUN_DATA_DIRECTORY: /var/lib/neurun
      NEURUN_PYTHON_EXECUTABLE: python3
      NEURUN_DATABASE_URL: postgres://neurun:${POSTGRES_PASSWORD:-neurun-local-change-me}@postgres:5432/neurun?sslmode=disable
      # Local subprocess execution is for trusted uploaded code only.
      NEURUN_TRUSTED_CODE_EXECUTION: "true"
      NEURUN_OPERATOR_ACCOUNTS: ${NEURUN_OPERATOR_ACCOUNTS:-}
      NEURUN_OPERATOR_SESSION_TTL: ${NEURUN_OPERATOR_SESSION_TTL:-12h}
      NEURUN_OPERATOR_COOKIE_SECURE: ${NEURUN_OPERATOR_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NEURUN_HTTP_PORT:-1267}:1267"
    volumes:
      - neurun-data:/var/lib/neurun
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=768m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/neurun", "doctor"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ./frontend
    depends_on:
      neurun:
        condition: service_healthy
    environment:
      NEURUN_API_BASE_URL: http://neurun:1267
    ports:
      - "${NEURUN_DASHBOARD_PORT:-3001}:3001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
  neurun-data:
