name: deploy vps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags="-s -w \
              -X github.com/neurun-io/neurun/internal/buildinfo.Version=${GITHUB_SHA::12} \
              -X github.com/neurun-io/neurun/internal/buildinfo.Commit=${GITHUB_SHA} \
              -X github.com/neurun-io/neurun/internal/buildinfo.BuiltAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o neurun ./cmd/neurun

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Upload binary and deploy script
        run: |
          scp -i ~/.ssh/id_ed25519 neurun \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/apps/neurun/neurun.new"
          scp -i ~/.ssh/id_ed25519 deploy/redeploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/apps/neurun/redeploy.sh"

      - name: Terminate and re-serve
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod 700 /var/apps/neurun/redeploy.sh && /var/apps/neurun/redeploy.sh"

  deploy-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          # The API sits on its own port behind nginx; the dashboard takes the
          # default one — see deploy/bootstrap.sh. Both are read by the browser,
          # so Next.js inlines them here: changing either is a rebuild, not an
          # edit on the host.
          NEXT_PUBLIC_NEURUN_API_URL: http://${{ secrets.DEPLOY_HOST }}:8080
          NEXT_PUBLIC_NEURUN_GITHUB_APP_SLUG: neurun-io
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          tar -czf ../dashboard.tar.gz -C .next/standalone .

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Upload build and deploy script
        run: |
          scp -i ~/.ssh/id_ed25519 dashboard.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/apps/dashboard/dashboard.new.tar.gz"
          scp -i ~/.ssh/id_ed25519 deploy/redeploy-dashboard.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/apps/dashboard/redeploy-dashboard.sh"

      - name: Terminate and re-serve
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod 700 /var/apps/dashboard/redeploy-dashboard.sh && /var/apps/dashboard/redeploy-dashboard.sh"
