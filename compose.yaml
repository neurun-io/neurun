name: neurun

services:
  neurun:
    build:
      context: .
    environment:
      NEURUN_HTTP_ADDR: :8080
      NEURUN_PUBLIC_URL: ${NEURUN_PUBLIC_URL:-http://localhost:8080}
      NEURUN_API_KEY: ${NEURUN_API_KEY:?set NEURUN_API_KEY in .env}
      NEURUN_DEFAULT_PROJECT_ID: ${NEURUN_DEFAULT_PROJECT_ID:-prj_local}
      NEURUN_BLOCK_PRIVATE_NETWORKS: ${NEURUN_BLOCK_PRIVATE_NETWORKS:-true}
      NEURUN_ALLOW_VOLATILE_JOBS: ${NEURUN_ALLOW_VOLATILE_JOBS:-false}
    ports:
      - "${NEURUN_HTTP_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/neurun", "doctor"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    profiles: ["dependencies"]
    environment:
      POSTGRES_DB: neurun
      POSTGRES_USER: neurun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurun-local-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurun -d neurun"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    profiles: ["dependencies"]
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - nats-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["dependencies"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-neurun-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-neurun-local-change-me}
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  nats-data:
  minio-data:
